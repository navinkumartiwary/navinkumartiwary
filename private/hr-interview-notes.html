<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private notes · Navin Kumar Tiwary</title>
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{
  --navy:#14295A; --navy2:#1E3A7B; --gold:#B08433; --goldlt:#E2C27F; --goldbg:#F6EEDF;
  --ink:#12223F; --text:#3B475C; --muted:#6A7487; --line:#E2E6EC; --soft:#F4F6F9; --page:#F3F5F9;
  --green:#2E7D4F; --greenbg:#E6F4EC; --red:#B23B2A; --redbg:#FBEAE6;
  --font:"Manrope","Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:calc(var(--barh, 67px) + var(--tabsh, 62px) + 16px)}
body{margin:0; background:var(--page); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased}
a{color:var(--navy2)}
button{font:inherit; cursor:pointer}

/* ---------- lock screen ---------- */
.lock{min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px;
  background:radial-gradient(800px 420px at 85% -10%, rgba(226,194,127,.22), transparent 60%),
             radial-gradient(700px 380px at 0% 110%, rgba(78,120,214,.35), transparent 60%),
             linear-gradient(135deg,#14295A 0%,#1B3672 55%,#14295A 100%)}
.lockcard{width:100%; max-width:400px; background:#fff; border-radius:20px; padding:32px 28px 26px; box-shadow:0 30px 60px -24px rgba(0,0,0,.45); text-align:center}
.mono{width:56px; height:56px; border-radius:14px; background:var(--navy); color:#fff; display:grid; place-items:center; margin:0 auto 16px; font-weight:800; font-size:20px; letter-spacing:.02em}
.lockcard h1{margin:0; font-size:22px; color:var(--ink); letter-spacing:-.01em}
.lockcard p{margin:6px 0 20px; color:var(--muted); font-size:14px}
.field{position:relative}
.field input{width:100%; font:inherit; font-size:15px; padding:13px 46px 13px 14px; border:1px solid #CBD3DF; border-radius:12px; background:#F8FAFC; color:var(--ink)}
.field input:focus{outline:none; border-color:var(--navy2); box-shadow:0 0 0 3px rgba(30,58,123,.15); background:#fff}
.eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--muted); width:36px; height:36px; border-radius:8px; display:grid; place-items:center}
.eye:hover{background:var(--soft)}
.remember{display:flex; align-items:center; gap:8px; justify-content:flex-start; font-size:13.5px; color:var(--text); margin:12px 2px 16px; cursor:pointer}
.remember input{width:16px; height:16px; accent-color:var(--navy)}
.unlock{width:100%; border:0; background:var(--navy); color:#fff; font-weight:800; font-size:15px; padding:13px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px}
.unlock:hover{background:var(--navy2)}
.unlock[disabled]{opacity:.7; cursor:wait}
.err{min-height:20px; margin:10px 0 0; font-size:13px; font-weight:700; color:var(--red)}
.lockfoot{margin-top:14px; font-size:12px; color:var(--muted)}
.lockfoot a{color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- notes ---------- */
.app[hidden], .lock[hidden]{display:none}
.bar{position:sticky; top:0; z-index:30; background:rgba(20,41,90,.97); color:#fff; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.bar .in{max-width:1280px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px}
.bar .brand{font-weight:800; font-size:15px; display:flex; align-items:center; gap:10px; white-space:nowrap}
.bar .brand .m{width:30px; height:30px; border-radius:8px; background:#fff; color:var(--navy); display:grid; place-items:center; font-size:12px; font-weight:800}
.bar .brand .pv{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--goldlt); border:1px solid rgba(226,194,127,.5); border-radius:999px; padding:2px 8px}
.search{flex:1; max-width:420px; margin-left:auto; position:relative}
.search input{width:100%; font:inherit; font-size:14px; padding:9px 12px 9px 36px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.1); color:#fff}
.search input::placeholder{color:rgba(255,255,255,.6)}
.search input:focus{outline:none; background:#fff; color:var(--ink); border-color:#fff}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:rgba(255,255,255,.7); pointer-events:none}
.search input:focus + svg{color:var(--muted)}
.ib{border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.ib:hover{background:rgba(255,255,255,.16)}
.ib svg{width:15px; height:15px}

.layout{max-width:1280px; margin:0 auto; padding:24px 20px 64px; display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; align-items:start}
.layout > *{min-width:0}
.toc{position:sticky; top:calc(var(--barh, 67px) + 12px); background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 12px; max-height:calc(100vh - var(--barh, 67px) - 24px); overflow:auto}
.toc .h{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 8px 8px}
.toc a{display:flex; gap:10px; align-items:baseline; padding:7px 8px; border-radius:8px; text-decoration:none; color:var(--text); font-size:13.5px; font-weight:600; line-height:1.35}
.toc a span{font-size:11px; font-weight:800; color:var(--muted); min-width:18px}
.toc a:hover{background:var(--soft); color:var(--navy)}
.toc a.on{background:#EAF0FA; color:var(--navy)}
.toc a.on span{color:var(--gold)}
.progress{margin:14px 8px 4px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); font-weight:600}
.progress .track{height:6px; background:var(--soft); border-radius:99px; margin-top:6px; overflow:hidden}
.progress .fill{height:100%; width:0; background:linear-gradient(90deg,var(--navy2),var(--gold)); border-radius:99px; transition:width .3s}

.vtabs{position:sticky; top:calc(var(--barh, 67px) + 8px); z-index:25; display:flex; gap:6px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:6px; margin-bottom:14px; box-shadow:0 0 0 8px var(--page), 0 10px 22px -16px rgba(18,34,63,.45)}
.short{margin:0 0 12px !important; background:#EAF0FA; border-left:4px solid var(--navy2); border-radius:10px; padding:10px 12px; font-size:15px; color:var(--ink)}
.short b{color:var(--navy2)}
.pos{display:inline-block; margin-left:6px; font-size:11px; font-weight:800; color:var(--gold); background:var(--goldbg); border-radius:999px; padding:1px 7px; vertical-align:1px; white-space:nowrap}
.syn{display:block; margin-top:3px; font-size:13px; color:var(--muted)}
.t.mist td{width:33%}
.t.mist td.bad{color:#9A3324; font-weight:600}
.t.mist td.good{color:#2E7D4F; font-weight:700}
.t.pron td:first-child{font-weight:700; color:var(--ink); width:28%}
.t.pron td:nth-child(2){color:var(--navy2); width:32%}
.t.rel td:first-child{white-space:normal !important; width:20% !important; color:var(--ink) !important}
.t.rel td:nth-child(2){width:26%; font-weight:600; color:var(--navy2)}
@media (max-width:640px){ .t.mist thead, .t.pron thead{display:none} .t.mist tr, .t.pron tr{display:block; padding:10px 12px; border-top:1px solid var(--line)} .t.mist td, .t.pron td{display:block; border:0; padding:2px 0; width:auto !important} }
.fixnote{margin:12px 0 0 !important; background:#FBEAE6; color:#7A2A1E; border-radius:10px; padding:10px 12px; font-size:14px}
.fixnote b{color:#7A2A1E}
.vt{flex:1; border:0; background:none; border-radius:10px; padding:10px 12px; font-weight:800; font-size:14px; color:var(--muted)}
.vt:hover{background:var(--soft); color:var(--navy)}
.vt.on{background:var(--navy); color:#fff}
@media (max-width:640px){ .vtabs{gap:4px; padding:4px} .vt{padding:9px 6px; font-size:12.5px; line-height:1.25} }
.view[hidden]{display:none}
.rng{font-size:12px; font-weight:800; color:var(--gold); background:var(--goldbg); border-radius:999px; padding:3px 10px; margin-left:4px; white-space:nowrap}
.t.dict td{width:33%}
.t.dict.ph td{width:50%}
.t.voc td:first-child{width:20%} .t.voc td:nth-child(2){width:30%} .t.voc td:nth-child(3){width:50%; color:var(--text); font-weight:400}
.t.voc em.fix{display:block; margin-top:4px; font-style:normal; font-size:13px; color:#7A2A1E; background:#FBEAE6; border-radius:6px; padding:4px 8px}

.t.dict td:first-child{font-weight:700; color:var(--ink)}
.t.dict td[lang=hi]{font-family:"Noto Sans Devanagari","Manrope",sans-serif; font-size:15px; line-height:1.6}
.t.dict td:nth-child(2){color:var(--navy2); font-weight:600}
@media (max-width:640px){ .t.dict thead{display:none} .t.dict tr{display:block; padding:10px 12px; border-top:1px solid var(--line)} .t.dict td{display:block; border:0; padding:2px 0; width:auto !important} .t.dict td:nth-child(3)::before{content:"At work: "; font-family:var(--font); font-size:12px; font-weight:800; color:var(--gold)} }
@media (max-width:640px){ .t.dict.voc td:nth-child(3)::before{content:"Example: "} }
.t.arts td:first-child{white-space:nowrap; font-weight:800; color:var(--gold); width:76px}
.t.arts td:nth-child(2){font-weight:700; color:var(--ink); width:30%}
.t.arts em{display:block; margin-top:4px; font-style:normal; font-size:13px; color:var(--navy2); background:#EAF0FA; border-radius:6px; padding:4px 8px}
@media (max-width:640px){ .t.arts thead{display:none} .t.arts tr{display:block; padding:10px 12px; border-top:1px solid var(--line)} .t.arts td{display:block; border:0; padding:2px 0; width:auto !important} }
.hero{background:linear-gradient(135deg,#14295A,#1E3A7B); color:#fff; border-radius:20px; padding:28px 28px 24px; margin-bottom:20px; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-60px; top:-60px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle, rgba(226,194,127,.35), transparent 70%)}
.hero .eb{margin:0 0 6px; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--goldlt)}
.hero h1{margin:0; font-size:clamp(24px,3.4vw,32px); letter-spacing:-.02em; line-height:1.15}
.hero p{margin:8px 0 0; color:rgba(255,255,255,.8); max-width:44rem}
.hero .tools{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; position:relative; z-index:1}

.sec{background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px 28px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(18,34,63,.03), 0 10px 26px -18px rgba(18,34,63,.18)}
.sec h2{margin:0 0 10px; font-size:22px; color:var(--ink); letter-spacing:-.015em; display:flex; align-items:center; gap:12px; line-height:1.25}
.sec h2 .no{flex:none; width:36px; height:36px; border-radius:10px; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:800}
.sec h3{margin:22px 0 8px; font-size:16.5px; color:var(--navy)}
.sec p{margin:0 0 12px}
.sec ul,.sec ol{margin:0 0 14px; padding-left:1.3em}
.sec li{margin-bottom:6px}
.sec li::marker{color:var(--gold)}
.sec b{color:var(--ink)}
.why{background:var(--soft); border-radius:12px; padding:10px 14px; font-size:14.5px}
.script{background:var(--goldbg); border-left:4px solid var(--gold); border-radius:12px; padding:16px 18px; font-size:15.5px; color:var(--ink)}
.script p:last-child{margin-bottom:0}
.note{font-size:14px; color:var(--muted)}
.warn{background:var(--redbg); color:#7A2A1E; border-radius:12px; padding:10px 14px; font-size:14.5px}
.warn b{color:#7A2A1E}
.tip{background:#EAF0FA; border-radius:12px; padding:10px 14px; font-size:14.5px; color:var(--ink)}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:6px 0 14px}
.stats div{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#FBFCFE}
.stats b{display:block; font-size:24px; font-weight:800; color:var(--navy); line-height:1.1}
.stats span{font-size:13px; color:var(--muted)}
.t{width:100%; border-collapse:separate; border-spacing:0; font-size:14px; margin:6px 0 16px; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:block; overflow-x:auto}
.t thead, .t tbody{display:table; width:100%; border-collapse:collapse}
.t th{background:var(--soft); text-align:left; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:10px 12px}
.t td{padding:10px 12px; border-top:1px solid var(--line); vertical-align:top}
.t.law td:last-child{white-space:nowrap; font-weight:800; color:var(--gold)}
.t.law td:first-child{font-weight:700; color:var(--ink); width:22%}
.changes li{margin-bottom:10px}

.qa{margin-top:16px; display:flex; flex-direction:column; gap:10px}
.qa h4{margin:0}
details{border:1px solid var(--line); border-radius:12px; background:#FBFCFE; transition:border-color .15s}
details[open]{border-color:#C9D3E3; background:#fff}
summary{list-style:none; cursor:pointer; padding:13px 14px 13px 46px; position:relative; font-weight:700; color:var(--ink); font-size:15px; line-height:1.4; padding-right:116px}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q"; position:absolute; left:12px; top:11px; width:24px; height:24px; border-radius:7px; background:#EAF0FA; color:var(--navy2); font-size:12px; font-weight:800; display:grid; place-items:center}
details[open] summary::before{background:var(--navy); color:#fff}
summary:hover{color:var(--navy2)}
.done{position:absolute; right:10px; top:9px; border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; font-size:11.5px; font-weight:800; padding:4px 10px; display:inline-flex; align-items:center; gap:5px}
.done::after{content:attr(data-label)}
.done:hover{border-color:var(--green); color:var(--green)}
details.is-done .done{background:var(--greenbg); border-color:var(--greenbg); color:var(--green)}
details.is-done summary::before{content:"✓"; background:var(--greenbg); color:var(--green)}
details > div{padding:0 16px 14px 46px; font-size:15px}
details > div p:last-child, details > div ul:last-child, details > div ol:last-child{margin-bottom:0}
ul.check{list-style:none; padding-left:0}
ul.check li{padding-left:28px; position:relative}
ul.check li::before{content:""; position:absolute; left:0; top:4px; width:16px; height:16px; border:2px solid var(--gold); border-radius:5px}
.src a{font-weight:700}
mark{background:#FDE9B5; color:inherit; border-radius:3px; padding:0 1px}
.hide{display:none !important}
.empty{display:none; background:#fff; border:1px dashed var(--line); border-radius:16px; padding:28px; text-align:center; color:var(--muted)}
.foot{font-size:12.5px; color:var(--muted); text-align:center; margin-top:8px}

@media (max-width:980px){
  .layout{grid-template-columns:1fr; padding-top:16px}
  .toc{position:static; max-height:none; display:flex; gap:6px; overflow-x:auto; padding:10px; border-radius:14px}
  .toc .h, .progress{display:none}
  .toc a{flex:none; white-space:nowrap; padding:6px 10px; background:var(--soft)}
}
@media (max-width:640px){
  .bar .in{flex-wrap:wrap; gap:10px; padding:10px 14px}
  .search{order:3; flex-basis:100%; max-width:none}
  .bar .brand .pv{display:none}
  .ib .lbl{display:none}
  #lockbtn{margin-left:auto}
  .layout{padding:12px 12px 48px}
  .sec{padding:20px 16px 16px; border-radius:16px}
  .sec h2{font-size:19px}
  .hero{padding:22px 18px 18px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  summary{padding-right:14px; padding-bottom:40px}
  .done{top:auto; bottom:9px; left:46px; right:auto}
  details > div{padding-left:16px}
}
@media print{
  .bar,.toc,.hero .tools,.done,.lock{display:none !important}
  .layout{display:block; padding:0}
  .sec{box-shadow:none; break-inside:avoid-page}
  details > div{display:block !important}
}

/* Data Science tab */
.cw{position:relative; margin:0 0 14px}
pre.code{background:#0F1E3D; color:#E6ECF7; border-radius:12px; padding:14px 16px; margin:0; overflow-x:auto; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; tab-size:4; -webkit-text-size-adjust:100%}
pre.code code{background:none !important; color:inherit !important; padding:0 !important; font:inherit !important; white-space:pre}
pre.code .c{color:#8FA3C7; font-style:italic}
.sec code, details code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86em; background:#EEF2F8; color:#1E3A7B; border-radius:5px; padding:1px 5px; overflow-wrap:anywhere}
.cp{position:absolute; top:8px; right:8px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#DCE4F2; border-radius:8px; font:700 11.5px var(--font); padding:4px 10px; cursor:pointer}
.cp::after{content:attr(data-label)}
.cp:hover{background:rgba(255,255,255,.18)}
.cp.ok{background:#2E9E5B; border-color:#2E9E5B; color:#fff}
.sol{font-size:11.5px !important; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--green); margin:2px 0 6px !important}
details.ex summary::before{content:"Ex"; background:#ECF8F0; color:#2E9E5B}
details.ex[open] summary::before{background:#2E9E5B; color:#fff}
@media (max-width:640px){ pre.code{font-size:12px; padding:12px 12px} .vtabs{flex-wrap:wrap} .vt{flex:1 1 30%} }
</style>
</head>
<body>

<main class="lock" id="lock">
  <form class="lockcard" id="form" autocomplete="off">
    <div class="mono">NT</div>
    <h1>Private notes</h1>
    <p>This page is locked. Enter your password to open it.</p>
    <div class="field">
      <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <label class="remember"><input type="checkbox" id="rem"> Remember on this device</label>
    <button class="unlock" id="go" type="submit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Unlock</button>
    <p class="err" id="err" role="alert"></p>
    <p class="lockfoot"><a href="../index.html">← Back to the website</a></p>
  </form>
</main>

<div class="app" id="app" hidden>
  <header class="bar"><div class="in">
    <div class="brand"><span class="m">NT</span>Interview notes <span class="pv">Private</span></div>
    <label class="search"><input type="search" id="q" placeholder="Search notes, e.g. gratuity, PIP, WPS" aria-label="Search notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label>
    <button class="ib" id="lockbtn" type="button" title="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="lbl">Lock</span></button>
  </div></header>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sections"><p class="h">Sections</p></nav>
    <div>
      <div class="vtabs" role="tablist">
        <button type="button" class="vt on" data-v="notes" role="tab">Interview notes</button>
        <button type="button" class="vt" data-v="pack" role="tab">Prep Pack</button>
        <button type="button" class="vt" data-v="law" role="tab">UAE Labour Law</button>
        <button type="button" class="vt" data-v="dict" role="tab">English–Hindi</button>
        <button type="button" class="vt" data-v="ds" role="tab">Data Science</button>
      </div>
      <div class="hero">
        <p class="eb" id="heb"></p>
        <h1 id="htitle"></h1>

const KEY_STORE = 'nt-notes-pw', DONE_STORE = 'nt-notes-done';
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} },
  del(k){ try { localStorage.removeItem(k); } catch(e) {} }
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(buf);
}

async function tryUnlock(pw, silent){
  try {
    const html = await decrypt(pw);
    open_(html);
    return true;
  } catch(e) {
    if (!silent){
      $('err').textContent = 'That password is not right. Please try again.';
      $('form').classList.remove('shake'); void $('form').offsetWidth; $('form').classList.add('shake');
    }
    return false;
  }
}

let view = 'notes';
function setSticky(){
  const bar = document.querySelector('.bar'), tabs = document.querySelector('.vtabs');
  if (bar) document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px');
  if (tabs) document.documentElement.style.setProperty('--tabsh', tabs.offsetHeight + 'px');
}
window.addEventListener('resize', setSticky);
const V = () => document.querySelector(`#content .view[data-view="${view}"]`) || $('content');
function showView(v){
  view = v;
  document.querySelectorAll('#content .view').forEach(x => x.hidden = x.dataset.view !== v);
  document.querySelectorAll('.vt').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const el = V();
  $('heb').textContent = el.dataset.eb || ''; $('htitle').textContent = el.dataset.title || ''; $('hsub').textContent = el.dataset.sub || '';
  $('htools').style.display = (v === 'notes' || v === 'pack' || v === 'ds') ? '' : 'none';
  $('q').value = ''; $('q').dispatchEvent(new Event('input'));
  buildToc(); spy();
  try { history.replaceState(null, '', v === 'law' ? '#articles' : v === 'dict' ? '#dictionary' : v === 'pack' ? '#pack' : v === 'ds' ? '#datascience' : location.pathname); } catch(e) {}
  window.scrollTo(0, 0);
}
document.querySelectorAll('.vt').forEach(b => b.addEventListener('click', () => showView(b.dataset.v)));
function open_(html){
  $('content').innerHTML = html;
  $('lock').hidden = true; $('app').hidden = false;
  setupQA(); setupCode(); setupSearch(); setSticky(); showView(location.hash === '#articles' ? 'law' : location.hash === '#dictionary' ? 'dict' : location.hash === '#pack' ? 'pack' : location.hash === '#datascience' ? 'ds' : 'notes');
  document.title = 'HR Manager interview notes · Private';
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value; if (!pw) return;
  $('go').disabled = true; $('err').textContent = '';
  const ok = await tryUnlock(pw, false);
  $('go').disabled = false;
  if (ok){ if ($('rem').checked) store.set(KEY_STORE, pw); $('pw').value = ''; }
});
$('eye').addEventListener('click', () => { const i = $('pw'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus(); });
$('lockbtn').addEventListener('click', () => {
  store.del(KEY_STORE);
  $('content').innerHTML = ''; $('toc').querySelectorAll('a, .progress').forEach(n => n.remove());
  $('app').hidden = true; $('lock').hidden = false; $('pw').focus();
  document.title = 'Private notes · Navin Kumar Tiwary';
});

function buildToc(){
  const toc = $('toc');
  toc.querySelectorAll('a, .progress').forEach(n => n.remove());
  V().querySelectorAll('.sec').forEach(s => {
    const h = s.querySelector('h2'); const no = h.querySelector('.no');
    const a = document.createElement('a'); a.href = '#' + s.id; a.dataset.id = s.id;
    const hc = h.cloneNode(true); hc.querySelectorAll('.no, .rng').forEach(x => x.remove());
    a.innerHTML = `<span>${no ? no.textContent : ''}</span>${hc.textContent.trim()}`;
    toc.appendChild(a);
  });
  const p = document.createElement('div'); p.className = 'progress';
  p.innerHTML = '<span id="ptext"></span><div class="track"><div class="fill" id="pfill"></div></div>';
  if (V().querySelector('details')) { toc.appendChild(p); progress(); }
}

function setupCode(){
  document.querySelectorAll('#content pre.code').forEach(pre => {
    const w = document.createElement('div'); w.className = 'cw';
    pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cp'; b.dataset.label = 'Copy';
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(pre.textContent); b.dataset.label = 'Copied'; b.classList.add('ok'); }
      catch(e) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.dataset.label = 'Selected'; }
      setTimeout(() => { b.dataset.label = 'Copy'; b.classList.remove('ok'); }, 1600);
    });
    w.appendChild(b);
  });
}
function doneSet(){ try { return new Set(JSON.parse(store.get(DONE_STORE) || '[]')); } catch(e) { return new Set(); } }
function setupQA(){
  const done = doneSet();
  document.querySelectorAll('#content details').forEach((d, i) => {
    const s = d.querySelector('summary');
    const key = s.textContent.trim().slice(0, 80);
    d.dataset.key = key;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'done';
    s.appendChild(b);
    const paint = () => { const on = doneSet().has(key); d.classList.toggle('is-done', on); b.dataset.label = on ? '✓ Practised' : 'Mark practised'; };
    b.addEventListener('click', ev => {
      ev.preventDefault(); ev.stopPropagation();
      const set = doneSet(); set.has(key) ? set.delete(key) : set.add(key);
      store.set(DONE_STORE, JSON.stringify([...set])); paint(); progress();
    });
    paint();
  });
  progress();
}
function progress(){
  const all = V().querySelectorAll('details').length;
  const n = V().querySelectorAll('details.is-done').length;
  if ($('ptext')) $('ptext').textContent = `${n} of ${all} ${view === 'ds' ? 'exercises and questions' : 'questions'} practised`;
  if ($('pfill')) $('pfill').style.width = (all ? 100 * n / all : 0) + '%';
}
$('reset').addEventListener('click', () => { store.del(DONE_STORE); document.querySelectorAll('#content details').forEach(d => { d.classList.remove('is-done'); const b = d.querySelector('.done'); if (b) b.dataset.label = 'Mark practised'; }); progress(); });
let expanded = false;
$('expand').addEventListener('click', () => {
  expanded = !expanded;
  document.querySelectorAll('#content details').forEach(d => d.open = expanded);
  $('expandlbl').textContent = expanded ? 'Hide all answers' : 'Show all answers';
});
$('print').addEventListener('click', () => window.print());

/* search: hide blocks that don't match, highlight matches */
function setupSearch(){
  const q = $('q');
  q.value = '';
  q.oninput = () => {
    const term = q.value.trim().toLowerCase();
    document.querySelectorAll('#content mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    document.querySelectorAll('#content').forEach(c => c.normalize());
    let any = false;
    V().querySelectorAll('.sec').forEach(sec => {
      if (!term){ sec.classList.remove('hide'); sec.querySelectorAll('.hide').forEach(x => x.classList.remove('hide')); any = true; return; }
      const blocks = sec.querySelectorAll(':scope > *:not(h2):not(.qa):not(table), .qa > details, table tbody tr');
      const secHit = sec.querySelector('h2').textContent.toLowerCase().includes(term);
      let hit = secHit;
      blocks.forEach(b => {
        const m = b.textContent.toLowerCase().includes(term);
        b.classList.toggle('hide', !(m || secHit));
        if (m){ hit = true; if (b.tagName === 'DETAILS') b.open = true; }
      });
      sec.classList.toggle('hide', !hit);
      if (hit){ any = true; highlight(sec, term); }
    });
    $('empty').style.display = any ? 'none' : 'block';
  };
}
function highlight(root, term){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n =>
    n.parentElement.closest('.done, .hide') ? NodeFilter.FILTER_REJECT : (n.nodeValue.toLowerCase().includes(term) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP) });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const v = n.nodeValue, i = v.toLowerCase().indexOf(term);
    const mark = document.createElement('mark'); mark.textContent = v.slice(i, i + term.length);
    const after = n.splitText(i); after.nodeValue = after.nodeValue.slice(term.length);
    n.parentNode.insertBefore(mark, after);
  });
}

/* highlight current section in the side menu */
function spy(){
  const links = [...document.querySelectorAll('#toc a')];
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting){ links.forEach(a => a.classList.toggle('on', a.dataset.id === e.target.id)); } });
  }, { rootMargin:'-90px 0px -65% 0px' });
  if (window._obs) window._obs.disconnect(); window._obs = obs;
  V().querySelectorAll('.sec').forEach(s => obs.observe(s));
}

(async () => {
  const saved = store.get(KEY_STORE);
  if (saved && await tryUnlock(saved, true)) return;
  if (saved) store.del(KEY_STORE);
  $('pw').focus();
})();
</script>
